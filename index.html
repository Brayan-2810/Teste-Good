<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placar Pixel Art</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>🏆 TOP 10 MELHORES TEMPOS</h1>

        <div class="placar-container">

            <table class="leaderboard-table">

                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Jogador</th>
                        <th>Tempo</th>
                    </tr>
                </thead>

                <tbody id="placar-corpo">

                    <tr>
                        <td colspan="3" class="mensagem">
                            ⏳ Carregando tempos...
                        </td>
                    </tr>

                </tbody>

            </table>

            <button
                id="botao-atualizar"
                class="botao-atualizar"
                type="button">
                🔄 Atualizar placar
            </button>

        </div>

        <iframe src="Jogo Good HTML5/index.html" width="800" height="600" style="border:none;"></iframe>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
